    summary: Vector spaces, eigenvalues, and matrix factorisations, with a computational track in NumPy.
    description: >-
      The standard second-year linear algebra course with an applied slant.
      Proofs are expected, but every major theorem is paired with a computation:
      least squares on real measurement data, PageRank on a crawled subgraph, and
      image compression with the SVD. Weekly problem sets alternate between
      written proofs and short notebooks.
    prerequisites: [MATH-101 Calculus I]
