courses:
  # -------------------------------------------------------------------------
  # The course `id` doubles as its URL and as its folder under public/courses,
  # so files for this course belong in public/courses/operating-systems/.
  # -------------------------------------------------------------------------
  - id: operating-systems
    code: CE-341
    title: Operating Systems
    semester: fall-2026
    category: cs
    status: published
    level: undergraduate
    credits: 4
    capacity: 90
    enrolled: 84
    color: "#6366f1"
    location: Engineering Hall, Room 201
    professors: [nasseri]
    assistants: [mehta, chen]
    tags: [core, systems, c-programming, lab]
    summary: >-
      Processes, scheduling, virtual memory, file systems, and concurrency,
      built around a semester-long kernel project.
    description: >-
      A hands-on treatment of how an operating system works, from the boot
      sequence to the page fault handler. Lectures follow the classic topics;
      the lab track has you extend a teaching kernel written in C until it can
      run a preemptive scheduler, a copy-on-write fork, and a journaling file
      system. Weekly labs are graded by an autograder with three free late days
      for the semester.
    prerequisites:
      - CE-201 Computer Architecture
      - CE-210 Data Structures
    objectives:
      - Explain how the kernel isolates processes and multiplexes the CPU.
      - Implement a preemptive scheduler and measure its fairness.
      - Reason about race conditions and prove a locking scheme correct.
      - Build a crash-consistent file system layer.
    schedule:
      - { day: Mon, start: "10:00", end: "11:30", room: EH 201 }
      - { day: Wed, start: "10:00", end: "11:30", room: EH 201 }
      - { day: Fri, start: "14:00", end: "16:00", room: EH Lab B }
    grading:
      - { label: Labs, weight: 40 }
      - { label: Homework, weight: 15 }
      - { label: Midterm, weight: 20 }
      - { label: Final exam, weight: 25 }
    modules:
      - { id: processes, title: Processes and the kernel boundary, summary: System calls, traps, and the process abstraction. }
      - { id: scheduling, title: Scheduling, summary: Round robin through CFS, and how to measure fairness. }
      - { id: memory, title: Virtual memory, summary: Paging, TLBs, copy-on-write, and page replacement. }
      - { id: concurrency, title: Concurrency, summary: Locks, condition variables, and deadlock. }
      - { id: filesystems, title: File systems, summary: Inodes, journaling, and crash consistency. }
    materials:
      - title: Lecture 1 — What an operating system actually does
        type: slides
        file: lec01-intro.pdf
        module: processes
        week: 1
        author: nasseri
        tags: [systems]
        added: 2026-09-07
        downloads: 312
        description: Course logistics, the kernel/user boundary, and a tour of the teaching kernel.
      - title: "Operating Systems: Three Easy Pieces"
        type: ebook
        url: https://pages.cs.wisc.edu/~remzi/OSTEP/
        author: nasseri
        tags: [core]
        added: 2026-09-07
        downloads: 596
        description: Primary textbook. Free online; chapter numbers in the syllabus refer to this edition.
      - title: Lab 0 setup guide — toolchain and QEMU
        type: note
        file: lab0-setup.md
        module: processes
        week: 1
        author: mehta
        tags: [lab, c-programming]
        added: 2026-09-08
        downloads: 288
        description: Cross-compiler, QEMU, and the grading harness, on Linux and macOS.
      - title: Lecture 4 — CPU scheduling
        type: slides
        file: lec04-scheduling.pdf
        module: scheduling
        week: 3
        author: nasseri
        tags: [systems]
        added: 2026-09-21
        downloads: 241
      - title: Scheduler simulator (Python)
        type: code
        url: https://git.university.edu/ce341/sched-sim
        module: scheduling
        week: 3
        author: chen
        tags: [python, lab]
        added: 2026-09-22
        downloads: 176
        description: Plots turnaround and response time for FIFO, SJF, RR, and MLFQ.
      - title: Lecture 7 — Paging and the TLB
        type: slides
        file: lec07-paging.pdf
        module: memory
        week: 5
        author: nasseri
        tags: [systems]
        added: 2026-10-05
        downloads: 198
      - title: Recitation recording — page fault walkthrough
        type: video
        url: https://media.university.edu/ce341/rec-pagefault
        module: memory
        week: 5
        author: chen
        tags: [systems]
        added: 2026-10-07
        downloads: 134
        description: 52 minutes. Single-steps a fault from the trap frame to the physical frame allocator.
      - title: Deadlock detection worksheet
        type: note
        file: deadlock-worksheet.pdf
        module: concurrency
        week: 8
        author: mehta
        tags: [exam-prep]
        added: 2026-10-26
        visible: false
        description: Draft — release with the midterm review session.
    assignments:
      - title: Lab 1 — System calls
        type: lab
        released: 2026-09-08
        due: 2026-09-19 23:59
        points: 100
        weight: 10
        author: mehta
        tags: [lab, c-programming]
        submissions: 84
        graded: 84
        description: Add three system calls to the teaching kernel and write the user-space tests for them.
      - title: Lab 2 — Preemptive scheduler
        type: lab
        released: 2026-09-21
        due: 2026-10-03 23:59
        points: 100
        weight: 10
        author: mehta
        tags: [lab, c-programming]
        attachment: lab2.pdf
        submissions: 61
        graded: 12
        description: >-
          Replace the cooperative scheduler with a preemptive round-robin one
          driven by the timer interrupt, then measure response time under the
          provided workload mix. Submit the kernel patch and a one-page write-up.
      - title: Homework 3 — Virtual memory
        type: homework
        released: 2026-10-05
        due: 2026-10-17 23:59
        points: 60
        weight: 5
        author: nasseri
        tags: [systems]
        allowLate: false
        submissions: 8
        description: >-
          Six problems on page table walks, TLB reach, and page replacement.
          Problem 5 asks you to compute the working set from a supplied trace.
      - title: Midterm exam
        type: exam
        released: 2026-10-12
        due: 2026-10-28 12:00
        points: 200
        weight: 20
        author: nasseri
        tags: [exam-prep]
        allowLate: false
        description: >-
          Covers modules 1–3. Closed book, one double-sided sheet of notes
          allowed. Two hours, Engineering Hall 201.
      - title: Lab 3 — Copy-on-write fork
        type: lab
        released: 2026-10-19
        due: 2026-11-06 23:59
        points: 100
        weight: 10
        author: chen
        tags: [lab, c-programming]
        published: false
        description: >-
          Make fork() lazy. Share physical pages until first write, then split on
          the fault. The test suite checks both correctness and that you actually
          saved the copies.
    announcements:
      - title: Lab 2 deadline extended by 48 hours
        author: nasseri
        date: 2026-09-11 09:15
        pinned: true
        body: >-
          The autograder queue backed up on Tuesday night and several of you lost
