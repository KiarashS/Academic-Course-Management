  - id: statistical-machine-learning
    code: DS-402
    title: Statistical Machine Learning
    semester: fall-2026
    category: data
    status: published
    level: graduate
    credits: 3
    capacity: 60
    enrolled: 58
    color: "#10b981"
    location: Engineering Hall, Room 118
    professors: [varga]
    assistants: [mehta]
    tags: [machine-learning, python, project-based, elective]
    summary: From regularised regression to gradient boosting, with an emphasis on evaluation done honestly.
    description: >-
      Covers the bias–variance decomposition, regularisation, kernel methods,
      tree ensembles, and neural networks, always returning to the question of
      whether a reported number would survive a new sample. Assignments use
      scikit-learn and PyTorch; the final project runs on a dataset you choose
      and is graded partly on how well the evaluation resists leakage.
    prerequisites:
      - MATH-214 Linear Algebra
      - STAT-201 Probability
    objectives:
      - Choose a model class from the structure of the data, not from habit.
      - Design a validation scheme that matches how the model will be deployed.
      - Diagnose overfitting and leakage from learning curves.
    schedule:
      - { day: Tue, start: "09:00", end: "11:00", room: EH 118 }
      - { day: Thu, start: "16:00", end: "17:30", room: EH Lab A }
    grading:
