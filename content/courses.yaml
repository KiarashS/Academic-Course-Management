# ---------------------------------------------------------------------------
# Course Hub content
#
# This file is the site's source of truth. Edit it, rebuild, redeploy.
# Nothing you change in the browser is published — the browser only keeps a
# local draft, which Settings can export back into this format.
#
# Files live in  public/courses/<course id>/  and are referenced with `file:`.
# That folder is git-ignored, so run `npm run deploy` from a machine that has
# the files. See content/README.md for the full field reference.
# ---------------------------------------------------------------------------

