  - id: distributed-systems
    code: CE-521
    title: Distributed Systems
    semester: fall-2026
    category: cs
    status: published
    level: graduate
    credits: 3
    capacity: 35
    enrolled: 31
    color: "#f43f5e"
    location: Engineering Hall, Room 410
    professors: [nasseri]
    assistants: [chen]
    tags: [systems, theory, project-based]
    summary: Consensus, replication, and the failure modes that make distributed computing hard.
    description: >-
      A graduate course organised around reading and reproducing systems papers.
      We work through logical clocks, Paxos and Raft, linearizability, CRDTs, and
      the practical consistency models shipped by production databases. Each
      student reproduces one result from a paper of their choosing and presents
      it in the last three weeks.
    prerequisites:
      - CE-341 Operating Systems
      - Comfort with Go or Rust
    objectives:
      - Compare consensus protocols by their failure assumptions.
      - Test a replicated service under partition and clock skew.
      - Read a systems paper critically and reproduce its core claim.
    schedule:
      - { day: Tue, start: "13:00", end: "15:00", room: EH 410 }
      - { day: Thu, start: "13:00", end: "15:00", room: EH 410 }
    grading:
      - { label: Paper reviews, weight: 20 }
      - { label: Lab assignments, weight: 35 }
      - { label: Reproduction project, weight: 35 }
      - { label: Participation, weight: 10 }
    modules:
      - { id: time, title: Time and ordering }
      - { id: consensus, title: Consensus }
      - { id: replication, title: Replication and consistency }
    materials:
      - title: Time, Clocks, and the Ordering of Events (Lamport, 1978)
        type: paper
        url: https://lamport.azurewebsites.net/pubs/time-clocks.pdf
        module: time
        week: 1
        author: nasseri
        tags: [theory]
        added: 2026-09-08
        downloads: 142
        description: Week 1 reading. Review due Thursday.
      - title: In Search of an Understandable Consensus Algorithm (Raft)
